<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True or False Cascade - Vocabulary Game</title>
    <link rel="stylesheet" href="../shared/game-styles.css">
    <style>
        .pair-display {
            text-align: center;
            margin: 40px 0;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .word-display {
            font-size: 3em;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 30px;
            animation: slideInDown 0.5s ease;
        }

        .definition-display {
            font-size: 1.5em;
            color: var(--text-color);
            max-width: 800px;
            line-height: 1.6;
            padding: 30px;
            background: var(--bg-light);
            border-radius: 15px;
            animation: slideInUp 0.5s ease 0.2s both;
        }

        .answer-buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
        }

        .answer-btn {
            padding: 30px 60px;
            font-size: 2em;
            font-weight: bold;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-lg);
            min-width: 200px;
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .answer-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-true {
            background: linear-gradient(135deg, #38ef7d 0%, #11998e 100%);
            color: white;
        }

        .btn-false {
            background: linear-gradient(135deg, #f45c43 0%, #eb3349 100%);
            color: white;
        }

        .streak-display {
            text-align: center;
            margin: 20px 0;
            font-size: 1.3em;
        }

        .streak-number {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-color);
            display: inline-block;
            margin: 0 10px;
        }

        .streak-fire {
            font-size: 2em;
            display: inline-block;
        }

        .results-container {
            text-align: center;
            padding: 40px;
        }

        .results-title {
            font-size: 2.5em;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        .results-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .result-stat {
            background: var(--bg-light);
            padding: 20px;
            border-radius: 10px;
        }

        .result-stat-value {
            font-size: 3em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .result-stat-label {
            font-size: 1.2em;
            color: var(--text-color);
            margin-top: 10px;
        }

        .result-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .feedback-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5em;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .feedback-overlay.show {
            opacity: 1;
            animation: feedbackPop 0.8s ease;
        }

        .feedback-overlay.correct {
            color: var(--success-color);
        }

        .feedback-overlay.wrong {
            color: var(--error-color);
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes feedbackPop {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .word-display {
                font-size: 2em;
            }

            .definition-display {
                font-size: 1.2em;
                padding: 20px;
            }

            .answer-buttons {
                flex-direction: column;
                gap: 15px;
            }

            .answer-btn {
                padding: 20px 40px;
                font-size: 1.5em;
                min-width: 150px;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← Back to Menu</a>

    <div class="game-container">
        <div class="game-header">
            <div class="game-title">True or False Cascade</div>
            <div class="game-stats">
                <div class="stat">
                    <div class="stat-label">Question</div>
                    <div class="stat-value" id="questionNumber">1/20</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score">0</div>
                </div>
            </div>
        </div>

        <div class="game-content">
            <div id="gameView">
                <div class="streak-display">
                    Streak: <span class="streak-number" id="streakNumber">0</span>
                    <span class="streak-fire" id="streakFire"></span>
                </div>

                <div class="pair-display">
                    <div class="word-display" id="wordDisplay">Loading...</div>
                    <div class="definition-display" id="definitionDisplay">
                        Please wait while we load the vocabulary...
                    </div>
                </div>

                <div class="answer-buttons">
                    <button class="answer-btn btn-true" id="trueBtn">
                        ✓ TRUE
                    </button>
                    <button class="answer-btn btn-false" id="falseBtn">
                        ✗ FALSE
                    </button>
                </div>
            </div>

            <div id="resultsView" style="display: none;">
                <div class="results-container">
                    <div class="results-title">Game Complete!</div>
                    <div class="results-stats">
                        <div class="result-stat">
                            <div class="result-stat-value" id="finalScore">0</div>
                            <div class="result-stat-label">Final Score</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-stat-value" id="correctAnswers">0</div>
                            <div class="result-stat-label">Correct Answers</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-stat-value" id="accuracy">0%</div>
                            <div class="result-stat-label">Accuracy</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-stat-value" id="maxStreak">0</div>
                            <div class="result-stat-label">Best Streak</div>
                        </div>
                    </div>
                    <div class="result-buttons">
                        <button class="btn btn-primary" onclick="restartGame()">Play Again</button>
                        <a href="../index.html" class="btn btn-secondary" style="text-decoration: none; display: inline-block;">Back to Menu</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="feedback-overlay" id="feedbackOverlay"></div>

    <script src="../shared/game-utils.js"></script>
    <script>
        const utils = new VocabularyGameUtils();
        let gameState = {
            currentQuestion: 0,
            totalQuestions: 20,
            score: 0,
            streak: 0,
            maxStreak: 0,
            correctAnswers: 0,
            currentPair: null,
            isCorrectPair: false,
            allWords: [],
            questionsData: []
        };

        // Initialize game
        async function initGame() {
            gameState.allWords = await utils.loadWords();
            if (gameState.allWords.length === 0) {
                alert('Error loading vocabulary. Please refresh the page.');
                return;
            }
            generateAllQuestions();
            showNextQuestion();
        }

        // Generate all 20 questions at the start
        function generateAllQuestions() {
            const shuffledWords = utils.shuffle(gameState.allWords);

            for (let i = 0; i < gameState.totalQuestions; i++) {
                const isCorrect = Math.random() < 0.5;
                const word = shuffledWords[i % shuffledWords.length];

                if (isCorrect) {
                    // Show correct pair
                    gameState.questionsData.push({
                        word: word.word,
                        definition: word.definition,
                        isCorrect: true
                    });
                } else {
                    // Show word with wrong definition
                    let wrongWord;
                    do {
                        wrongWord = utils.getRandomWord();
                    } while (wrongWord.word === word.word);

                    gameState.questionsData.push({
                        word: word.word,
                        definition: wrongWord.definition,
                        isCorrect: false
                    });
                }
            }
        }

        // Show next question
        function showNextQuestion() {
            if (gameState.currentQuestion >= gameState.totalQuestions) {
                showResults();
                return;
            }

            // Enable buttons
            document.getElementById('trueBtn').disabled = false;
            document.getElementById('falseBtn').disabled = false;

            // Get current question
            const question = gameState.questionsData[gameState.currentQuestion];
            gameState.currentPair = question;
            gameState.isCorrectPair = question.isCorrect;

            // Update display
            document.getElementById('wordDisplay').textContent = question.word;
            document.getElementById('definitionDisplay').textContent = question.definition;
            document.getElementById('questionNumber').textContent =
                `${gameState.currentQuestion + 1}/${gameState.totalQuestions}`;

            updateStreakDisplay();
        }

        // Handle answer
        function handleAnswer(playerSaysTrue) {
            // Disable buttons
            document.getElementById('trueBtn').disabled = true;
            document.getElementById('falseBtn').disabled = true;

            // Check if answer is correct
            const isCorrect = (playerSaysTrue && gameState.isCorrectPair) ||
                            (!playerSaysTrue && !gameState.isCorrectPair);

            if (isCorrect) {
                gameState.correctAnswers++;
                gameState.streak++;
                gameState.score += 10 + (gameState.streak * 5); // Base 10 points + streak bonus

                if (gameState.streak > gameState.maxStreak) {
                    gameState.maxStreak = gameState.streak;
                }

                showFeedback(true);
            } else {
                gameState.streak = 0;
                showFeedback(false);
            }

            // Update score display
            document.getElementById('score').textContent = gameState.score;
            updateStreakDisplay();

            // Move to next question after delay
            setTimeout(() => {
                gameState.currentQuestion++;
                showNextQuestion();
            }, 1200);
        }

        // Show feedback
        function showFeedback(isCorrect) {
            const overlay = document.getElementById('feedbackOverlay');
            overlay.textContent = isCorrect ? '✓ CORRECT!' : '✗ WRONG!';
            overlay.className = 'feedback-overlay show ' + (isCorrect ? 'correct' : 'wrong');

            setTimeout(() => {
                overlay.className = 'feedback-overlay';
            }, 800);
        }

        // Update streak display
        function updateStreakDisplay() {
            const streakNum = document.getElementById('streakNumber');
            const streakFire = document.getElementById('streakFire');

            streakNum.textContent = gameState.streak;

            // Add fire emojis based on streak
            let fires = '';
            if (gameState.streak >= 10) {
                fires = '🔥🔥🔥';
            } else if (gameState.streak >= 5) {
                fires = '🔥🔥';
            } else if (gameState.streak >= 3) {
                fires = '🔥';
            }
            streakFire.textContent = fires;
        }

        // Show results
        function showResults() {
            document.getElementById('gameView').style.display = 'none';
            document.getElementById('resultsView').style.display = 'block';

            const accuracy = Math.round((gameState.correctAnswers / gameState.totalQuestions) * 100);

            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('correctAnswers').textContent =
                `${gameState.correctAnswers}/${gameState.totalQuestions}`;
            document.getElementById('accuracy').textContent = `${accuracy}%`;
            document.getElementById('maxStreak').textContent = gameState.maxStreak;

            // Save high score
            const isNewHighScore = utils.saveHighScore('true-or-false-cascade', gameState.score);
            if (isNewHighScore) {
                document.querySelector('.results-title').textContent =
                    '🎉 New High Score! 🎉';
            }
        }

        // Restart game
        function restartGame() {
            gameState = {
                currentQuestion: 0,
                totalQuestions: 20,
                score: 0,
                streak: 0,
                maxStreak: 0,
                correctAnswers: 0,
                currentPair: null,
                isCorrectPair: false,
                allWords: gameState.allWords,
                questionsData: []
            };

            document.getElementById('gameView').style.display = 'block';
            document.getElementById('resultsView').style.display = 'none';
            document.getElementById('score').textContent = '0';

            generateAllQuestions();
            showNextQuestion();
        }

        // Event listeners
        document.getElementById('trueBtn').addEventListener('click', () => handleAnswer(true));
        document.getElementById('falseBtn').addEventListener('click', () => handleAnswer(false));

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('gameView').style.display === 'none') return;

            const trueBtn = document.getElementById('trueBtn');
            const falseBtn = document.getElementById('falseBtn');

            if (trueBtn.disabled) return;

            if (e.key === 'ArrowLeft' || e.key === 't' || e.key === 'T') {
                handleAnswer(true);
            } else if (e.key === 'ArrowRight' || e.key === 'f' || e.key === 'F') {
                handleAnswer(false);
            }
        });

        // Start game
        initGame();
    </script>
</body>
</html>
